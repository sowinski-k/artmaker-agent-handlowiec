name: Nightly discovery pipeline

# Runs the discovery → research → draft pipeline every night at 03:00 UTC
# (~05:00 PL summer / 04:00 PL winter). Adjust schedule via cron syntax.
#
# IMPORTANT: this is a stub. To actually use it you need to:
#   1. Configure repo secrets matching .env.example keys (ANTHROPIC_API_KEY,
#      GEMINI_API_KEY, APIFY_API_TOKEN, GOOGLE_PLACES_API_KEY, etc.)
#   2. Decide on a persistent DB target — SQLite at data/leads.db won't
#      survive between runs in a fresh Actions runner. Options:
#        a) commit DB back to repo (small scale, easy)
#        b) use a managed Postgres (e.g. Neon free tier) and set DATABASE_URL
#        c) skip persistence and only emit drafts to Slack/email
#   3. Tune data/campaigns.json with what you actually want to discover.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      max_researches:
        description: 'Max total researches in this run (budget guard)'
        required: false
        default: '50'

concurrency:
  group: nightly-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run nightly discovery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_GMAPS_ACTOR: ${{ secrets.APIFY_GMAPS_ACTOR }}
          APIFY_ALLEGRO_ACTOR: ${{ secrets.APIFY_ALLEGRO_ACTOR }}
          APIFY_LINKEDIN_ACTOR: ${{ secrets.APIFY_LINKEDIN_ACTOR }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: gemini
        run: |
          python -m scripts.nightly_discovery --max ${{ inputs.max_researches || '50' }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: data/logs/
          if-no-files-found: ignore
          retention-days: 14
