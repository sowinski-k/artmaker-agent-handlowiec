name: Tests

# Smoke testy backendu - lecą na każdy push i PR. Cel: złapać oczywiste
# regresje (broken imports, schema drift, broken Pydantic validators) ZANIM
# trafią na produkcję.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -v --tb=short
        env:
          # Testy nie potrzebują prawdziwych kluczy - używają in-memory SQLite
          # przez conftest.py. Jeśli któryś test wykryje braki konfiguracji,
          # CI go zmiażdży i będziemy wiedzieć od razu.
          DATABASE_URL: 'sqlite:///:memory:'
          DRY_RUN: 'true'
