# Artmaker Agent - nginx reverse proxy.
# Streamlit nasłuchuje na 127.0.0.1:8501, nginx wystawia na 80 z basic auth.
# Gdy dorzucisz domenę -> dopisz `server_name twoja-domena.pl;` i przepuść
# certbot żeby zrobił SSL. Konfig jest gotowy na to.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Basic auth - jedyne zabezpieczenie bo nie ma SSL bez domeny.
    # Plik tworzy install.sh przez htpasswd.
    auth_basic "Artmaker Agent";
    auth_basic_user_file /etc/nginx/.htpasswd_artmaker;

    # Max upload size dla CSV importu w discovery
    client_max_body_size 16M;

    # Streamlit pod /
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket - Streamlit używa do live updates, krytyczne
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running connections (Streamlit trzyma WS otwarte)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

        # Buffering off dla streamingu (np. logi bulk research)
        proxy_buffering off;
    }

    # Streamlit specific paths
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Health check bez basic auth - przydatne dla zewnętrznego monitoringu
    location = /healthz {
        auth_basic off;
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Wytnij nginx version z headerów
    server_tokens off;
}
