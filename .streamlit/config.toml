# Ecombinat — Streamlit theme.
# Pełna paleta + custom CSS są w gui/theme.py (CSS injection na starcie aplikacji).
# Ten plik daje Streamlit'owi baseline tokenów które są respektowane natywnie.

[theme]
# Polska czerwień premium - primary CTA / accents
primaryColor = "#D4212C"

# Ciepła biel - tło głównej zawartości
backgroundColor = "#FAFAF7"

# Czysta biel - panele i karty
secondaryBackgroundColor = "#FFFFFF"

# Prawie czarny grafit - tekst główny
textColor = "#111111"

# Font UI - Inter (loaded via CSS injection w gui/theme.py)
font = "sans serif"

[server]
# Disable file watcher w produkcji (Streamlit Cloud i tak ignoruje)
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
# Hide deploy button / hamburger menu in production (looks cleaner)
toolbarMode = "minimal"
