# Railway config dla BACKEND service (FastAPI - Ecombinat API).
#
# Frontend (Next.js) jest osobnym service'em - patrz frontend/railway.toml.
# Aby utworzyć drugi service w tym samym projekcie Railway:
#   1. W panelu projektu: + Create -> Empty Service
#   2. Settings -> Source -> Connect repo same as backend
#   3. Settings -> Build -> Dockerfile Path: frontend/Dockerfile
#   4. Settings -> Build -> Watch Path: frontend
#   5. Variables: BACKEND_URL = http://<backend-service-name>.railway.internal:8000

[build]
builder = "DOCKERFILE"
dockerfilePath = "web/Dockerfile"
watchPatterns = ["web/**", "agent/**", "core/**", "scripts/**", "prompts/**", "requirements.txt"]

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
